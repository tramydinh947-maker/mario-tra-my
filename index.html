<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mario - Chất lượng thông tin</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#6ed6ff;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:linear-gradient(#65d8ff 0%,#a9edff 65%,#76d34c 65%);
}

.sun{
    position:absolute;
    width:90px;
    height:90px;
    border-radius:50%;
    background:#ffd83d;
    right:8%;
    top:8%;
    box-shadow:0 0 35px #ffe66d;
}

.cloud{
    position:absolute;
    width:130px;
    height:45px;
    background:white;
    border-radius:50px;
    opacity:.9;
}

.cloud:before,.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:55px;height:55px;
    left:20px;top:-25px;
}
.cloud:after{
    width:70px;height:70px;
    right:18px;top:-35px;
}

.c1{top:12%;left:8%}
.c2{top:25%;left:55%;transform:scale(.8)}
.c3{top:7%;left:35%;transform:scale(.6)}

#world{
    position:absolute;
    left:0;
    bottom:0;
    width:5000px;
    height:55%;
}

.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:75px;
    background:#7b4a25;
    border-top:12px solid #4caf35;
}

.pipe{
    position:absolute;
    bottom:75px;
    width:80px;
    height:100px;
    background:linear-gradient(90deg,#168b32,#39c950,#168b32);
    border:5px solid #087021;
    border-radius:8px 8px 0 0;
}

.pipe:before{
    content:"";
    position:absolute;
    left:-10px;
    top:-20px;
    width:90px;
    height:25px;
    background:#32c84c;
    border:5px solid #087021;
    border-radius:7px;
}

.question{
    position:absolute;
    bottom:230px;
    width:65px;
    height:65px;
    border:5px solid #9a5800;
    border-radius:8px;
    background:#ffbd22;
    color:white;
    font-size:38px;
    font-weight:bold;
    text-align:center;
    line-height:55px;
    box-shadow:inset 0 0 0 4px #ffd85a;
    cursor:pointer;
}

.question.used{
    background:#777;
    border-color:#555;
    color:#ccc;
}

.coin{
    position:absolute;
    bottom:160px;
    width:30px;
    height:42px;
    border-radius:50%;
    background:#ffd52a;
    border:4px solid #d89d00;
    animation:coin 1s infinite alternate;
}

@keyframes coin{
    from{transform:translateY(0)}
    to{transform:translateY(-12px)}
}

.enemy{
    position:absolute;
    bottom:75px;
    width:50px;
    height:42px;
    border-radius:25px 25px 15px 15px;
    background:#9b4b24;
    border:4px solid #673018;
}

.enemy:before,.enemy:after{
    content:"";
    position:absolute;
    width:10px;
    height:10px;
    background:white;
    border-radius:50%;
    top:10px;
}
.enemy:before{left:9px}
.enemy:after{right:9px}

#player{
    position:absolute;
    width:48px;
    height:58px;
    bottom:75px;
    left:150px;
    z-index:20;
    transition:transform .08s linear;
}

.head{
    position:absolute;
    width:38px;
    height:35px;
    left:5px;
    top:0;
    background:#f5b07b;
    border-radius:45%;
    border:3px solid #6b2c18;
}

.hat{
    position:absolute;
    width:45px;
    height:18px;
    left:1px;
    top:-5px;
    background:#e52b24;
    border-radius:20px 20px 5px 5px;
    border:3px solid #9d1612;
    z-index:2;
}

.body{
    position:absolute;
    width:38px;
    height:30px;
    left:5px;
    top:31px;
    background:#e52b24;
    border:3px solid #9d1612;
    border-radius:10px 10px 4px 4px;
}

.overall{
    position:absolute;
    width:22px;
    height:18px;
    left:13px;
    top:34px;
    background:#1765c0;
    border-radius:3px;
}

.eye{
    position:absolute;
    width:5px;
    height:8px;
    background:#111;
    top:13px;
    left:12px;
    border-radius:50%;
}

.eye2{
    left:27px;
}

#hud{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    display:flex;
    gap:15px;
    background:rgba(0,0,0,.7);
    color:white;
    padding:12px 20px;
    border-radius:18px;
    font-size:18px;
    font-weight:bold;
}

#startScreen,#questionBox,#endScreen{
    position:fixed;
    inset:0;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.65);
}

.panel{
    width:min(650px,90%);
    padding:35px;
    border-radius:25px;
    background:white;
    text-align:center;
    box-shadow:0 15px 50px rgba(0,0,0,.4);
}

.panel h1{
    color:#e52b24;
    font-size:40px;
    margin-top:0;
}

.panel h2{
    color:#1765c0;
}

button{
    border:0;
    border-radius:15px;
    padding:15px 25px;
    margin:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:#ffbd22;
    color:#4a2b00;
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
    filter:brightness(1.08);
}

.answer{
    display:block;
    width:90%;
    margin:10px auto;
    background:#e9f4ff;
    border:3px solid #6aa9df;
}

.answer:hover{
    background:#bfe1ff;
}

#controls{
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:150;
    display:flex;
    gap:10px;
}

.control{
    width:65px;
    height:65px;
    padding:0;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:28px;
}

#progress{
    position:fixed;
    top:75px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    color:white;
    font-weight:bold;
    text-shadow:2px 2px #333;
}

.hidden{display:none!important}

@media(max-width:600px){
    #hud{
        font-size:13px;
        gap:7px;
        padding:8px 10px;
    }

    .panel h1{font-size:28px}
    .panel{padding:22px}
}
</style>
</head>

<body>

<div id="game">

<div class="sun"></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>

<div id="world">

    <div class="pipe" style="left:600px"></div>
    <div class="pipe" style="left:1500px;height:130px"></div>
    <div class="pipe" style="left:2700px"></div>
    <div class="pipe" style="left:3900px;height:140px"></div>

    <div class="question" data-q="0" style="left:450px">?</div>
    <div class="question" data-q="1" style="left:1050px">?</div>
    <div class="question" data-q="2" style="left:1750px">?</div>
    <div class="question" data-q="3" style="left:2450px">?</div>
    <div class="question" data-q="4" style="left:3300px">?</div>
    <div class="question" data-q="5" style="left:4200px">?</div>

    <div class="coin" style="left:350px"></div>
    <div class="coin" style="left:850px"></div>
    <div class="coin" style="left:1350px"></div>
    <div class="coin" style="left:2200px"></div>
    <div class="coin" style="left:3100px"></div>
    <div class="coin" style="left:3800px"></div>

    <div class="enemy" style="left:750px"></div>
    <div class="enemy" style="left:1900px"></div>
    <div class="enemy" style="left:3000px"></div>
    <div class="enemy" style="left:3700px"></div>

    <div class="ground"></div>

    <div id="player">
        <div class="hat"></div>
        <div class="head">
            <div class="eye"></div>
            <div class="eye eye2"></div>
        </div>
        <div class="body"></div>
        <div class="overall"></div>
    </div>

</div>

<div id="hud">
    ⭐ Điểm: <span id="score">0</span>
    ❤️ Mạng: <span id="lives">3</span>
</div>

<div id="progress">
    Câu đúng: <span id="done">0</span>/6
</div>

<div id="startScreen">
    <div class="panel">
        <h1>🍄 MARIO HỌC TẬP</h1>
        <h2>Chất lượng thông tin</h2>
        <p>
            Hãy điều khiển Mario đi qua màn chơi,
            chạm vào các ô <b>?</b> để trả lời câu hỏi.
        </p>

        <p>
            🎮 <b>← →</b> để chạy<br>
            🦘 <b>SPACE / ↑</b> để nhảy
        </p>

        <button onclick="startGame()">▶ BẮT ĐẦU</button>
    </div>
</div>

<div id="questionBox" class="hidden">
    <div class="panel">
        <h2 id="questionText"></h2>
        <div id="answers"></div>
    </div>
</div>

<div id="endScreen" class="hidden">
    <div class="panel">
        <h1 id="endTitle"></h1>
        <h2 id="finalScore"></h2>
        <button onclick="restartGame()">🔄 CHƠI LẠI</button>
        <button onclick="backToMenu()">🏠 MENU</button>
    </div>
</div>

<div id="controls">
    <button class="control" id="leftBtn">◀</button>
    <button class="control" id="jumpBtn">▲</button>
    <button class="control" id="rightBtn">▶</button>
</div>

</div>

<script>

const questions = [

{
q:"Thông tin tốt cần có những đặc điểm nào?",
a:[
"Chỉ cần mới",
"Mới, chính xác, đầy đủ và sử dụng được",
"Chỉ cần nhiều",
"Chỉ cần nổi tiếng"
],
correct:1
},

{
q:"Tính mới của thông tin có nghĩa là gì?",
a:[
"Thông tin được cập nhật phù hợp với thời điểm hiện tại",
"Thông tin thật dài",
"Thông tin có nhiều hình ảnh",
"Thông tin được nhiều người thích"
],
correct:0
},

{
q:"Tính chính xác của thông tin nghĩa là gì?",
a:[
"Thông tin phải đẹp",
"Thông tin phải đúng sự thật",
"Thông tin phải dài",
"Thông tin phải mới nhất"
],
correct:1
},

{
q:"Tính đầy đủ của thông tin là gì?",
a:[
"Có đủ những thông tin cần thiết để giải quyết vấn đề",
"Có thật nhiều chữ",
"Có nhiều người chia sẻ",
"Thông tin phải ngắn"
],
correct:0
},

{
q:"Khi tìm thông tin trên Internet, chúng ta nên làm gì?",
a:[
"Tin ngay kết quả đầu tiên",
"Chỉ xem một nguồn",
"Kiểm tra nguồn và đối chiếu nhiều nguồn",
"Tin mọi video trên mạng"
],
correct:2
},

{
q:"Bốn tiêu chí quan trọng của thông tin là gì?",
a:[
"Mới – Đúng – Đủ – Dùng được",
"Nhanh – Dài – Đẹp – Nhiều",
"Hay – Vui – Đẹp – Ngắn",
"Mới – Dài – Nhiều – Nổi tiếng"
],
correct:0
}

];

let score=0;
let lives=3;
let done=0;
let currentQuestion=null;
let playing=false;

let x=150;
let y=75;
let vx=0;
let vy=0;

let left=false;
let right=false;
let jumping=false;

const player=document.getElementById("player");
const world=document.getElementById("world");

function startGame(){

    document.getElementById("startScreen").classList.add("hidden");

    score=0;
    lives=3;
    done=0;
    x=150;
    y=75;
    vx=0;
    vy=0;

    resetBlocks();
    updateHUD();

    playing=true;
}

function restartGame(){

    document.getElementById("endScreen").classList.add("hidden");

    score=0;
    lives=3;
    done=0;

    x=150;
    y=75;
    vx=0;
    vy=0;

    resetBlocks();
    updateHUD();

    playing=true;
}

function backToMenu(){

    document.getElementById("endScreen").classList.add("hidden");
    document.getElementById("startScreen").classList.remove("hidden");

    playing=false;
}

function resetBlocks(){

    document.querySelectorAll(".question").forEach(block=>{
        block.classList.remove("used");
        block.textContent="?";
    });
}

function updateHUD(){

    document.getElementById("score").textContent=score;
    document.getElementById("lives").textContent=lives;
    document.getElementById("done").textContent=done;

}

function openQuestion(index){

    if(!playing) return;

    const block=document.querySelector(
        `.question[data-q="${index}"]`
    );

    if(block.classList.contains("used")) return;

    currentQuestion=index;

    document.getElementById("questionText").textContent=
        questions[index].q;

    const answers=document.getElementById("answers");

    answers.innerHTML="";

    questions[index].a.forEach((answer,i)=>{

        const button=document.createElement("button");

        button.className="answer";
        button.textContent=
            String.fromCharCode(65+i)+". "+answer;

        button.onclick=()=>checkAnswer(i);

        answers.appendChild(button);

    });

    document.getElementById("questionBox")
        .classList.remove("hidden");

    playing=false;
}

function checkAnswer(index){

    const q=questions[currentQuestion];

    if(index===q.correct){

        score+=100;
        done++;

        const block=document.querySelector(
            `.question[data-q="${currentQuestion}"]`
        );

        block.classList.add("used");
        block.textContent="✓";

        updateHUD();

        document.getElementById("questionBox")
            .classList.add("hidden");

        if(done===questions.length){

            setTimeout(winGame,300);

        }else{

            playing=true;

        }

    }else{

        lives--;

        updateHUD();

        if(lives<=0){

            document.getElementById("questionBox")
                .classList.add("hidden");

            setTimeout(gameOver,300);

        }else{

            alert(
                "❌ Chưa đúng!\n\nĐáp án đúng là: "+
                q.a[q.correct]
            );

            playing=true;
        }
    }
}

function winGame(){

    playing=false;

    document.getElementById("endTitle").textContent=
        "🏆 BẠN ĐÃ THẮNG!";

    document.getElementById("finalScore").textContent=
        "⭐ Điểm của bạn: "+score;

    document.getElementById("endScreen")
        .classList.remove("hidden");
}

function gameOver(){

    playing=false;

    document.getElementById("endTitle").textContent=
        "💥 GAME OVER";

    document.getElementById("finalScore").textContent=
        "⭐ Điểm của bạn: "+score;

    document.getElementById("endScreen")
        .classList.remove("hidden");
}

function jump(){

    if(!playing) return;

    if(!jumping){

        vy=650;
        jumping=true;

    }
}

function update(){

    if(!playing){

        requestAnimationFrame(update);
        return;

    }

    if(left){
        vx-=25;
    }

    if(right){
        vx+=25;
    }

    if(!left && !right){

        if(vx>0) vx-=18;
        if(vx<0) vx+=18;

    }

    vx=Math.max(-300,Math.min(300,vx));

    x+=vx/60;

    if(x<50){
        x=50;
        vx=0;
    }

    if(x>4800){
        x=4800;
        vx=0;
    }

    vy-=1550/60;

    y+=vy/60;

    if(y<=75){

        y=75;
        vy=0;
        jumping=false;

    }

    player.style.left=x+"px";
    player.style.bottom=y+"px";

    const camera=Math.max(
        0,
        Math.min(4200,x-250)
    );

    world.style.transform=
        `translateX(${-camera}px)`;

    checkQuestionCollision();

    requestAnimationFrame(update);
}

function checkQuestionCollision(){

    const blocks=document.querySelectorAll(".question");

    blocks.forEach(block=>{

        if(block.classList.contains("used")) return;

        const bx=parseInt(block.style.left);

        if(
            Math.abs(x+24-bx-32)<50 &&
            y>130
        ){

            openQuestion(
                parseInt(block.dataset.q)
            );

        }

    });
}

document.addEventListener("keydown",e=>{

    if(
        e.key==="ArrowLeft" ||
        e.key==="a" ||
        e.key==="A"
    ){
        left=true;
    }

    if(
        e.key==="ArrowRight" ||
        e.key==="d" ||
        e.key==="D"
    ){
        right=true;
    }

    if(
        e.key===" " ||
        e.key==="ArrowUp" ||
        e.key==="w" ||
        e.key==="W"
    ){

        e.preventDefault();
        jump();

    }

});

document.addEventListener("keyup",e=>{

    if(
        e.key==="ArrowLeft" ||
        e.key==="a" ||
        e.key==="A"
    ){
        left=false;
    }

    if(
        e.key==="ArrowRight" ||
        e.key==="d" ||
        e.key==="D"
    ){
        right=false;
    }

});

function holdButton(button,callback){

    button.addEventListener("mousedown",()=>{
        callback(true);
    });

    button.addEventListener("mouseup",()=>{
        callback(false);
    });

    button.addEventListener("mouseleave",()=>{
        callback(false);
    });

    button.addEventListener("touchstart",e=>{
        e.preventDefault();
        callback(true);
    });

    button.addEventListener("touchend",e=>{
        e.preventDefault();
        callback(false);
    });
}

holdButton(
    document.getElementById("leftBtn"),
    v=>left=v
);

holdButton(
    document.getElementById("rightBtn"),
    v=>right=v
);

document.getElementById("jumpBtn")
.addEventListener("mousedown",jump);

document.getElementById("jumpBtn")
.addEventListener("touchstart",e=>{
    e.preventDefault();
    jump();
});

update();

</script>

</body>
</html>
